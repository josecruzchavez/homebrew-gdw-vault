name: Audit cask

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: brew audit + style
    runs-on: macos-14
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Add checked-out tap
        run: brew tap --custom-remote josecruzchavez/gdw-vault "$GITHUB_WORKSPACE"

      - name: Audit
        run: brew audit --cask --strict josecruzchavez/gdw-vault/gdw-vault

      - name: Style
        run: brew style ./Casks/gdw-vault.rb

      - name: Livecheck
        run: brew livecheck --cask josecruzchavez/gdw-vault/gdw-vault
